trigger:
  branches:
    include:
      - main

pr: none

# =========================================================
# SELF-HOSTED WINDOWS AGENT
# =========================================================

pool:
  name: 'batch13-pool'


# =========================================================
# VARIABLES
# =========================================================

variables:

  # =======================================================
  # AZURE
  # =======================================================

  RESOURCE_GROUP: 'VT-RG'
  STORAGE_ACCOUNT: 'vishalsa007'
  STORAGE_CONTAINER: 'chunkhound-artifacts'

  # =======================================================
  # AZURE CONTAINER REGISTRY
  # =======================================================

  ACR_NAME: 'vishalacr2026'
  ACR_LOGIN_SERVER: 'vishalacr2026.azurecr.io'
  ACR_REPOSITORY: 'chunkhound-artifact'

  # =======================================================
  # ARTIFACT
  # =======================================================

  ARTIFACT_DIR: 'artifacts'

  # Build 394 = 0.394
  # Build 395 = 0.395
  # Build 396 = 0.396

  APP_VERSION: '0.$(Build.BuildId)'
  ARTIFACT_FILE: 'chunkhound-$(Build.BuildId).tar.gz'


# =========================================================
# STAGES
# =========================================================

stages:

# =========================================================
# CHUNKHOUND BUILD AND PUBLISH
# =========================================================

- stage: ChunkHoundBuildAndPublish

  displayName: 'ChunkHound Build and Publish'

  jobs:

  - job: BuildAndPublish

    displayName: 'Build Artifact and Publish to Azure'

    steps:


    # =====================================================
    # 1. CHECKOUT
    # =====================================================

    - checkout: self

      displayName: 'Checkout Repository'


    # =====================================================
    # 2. VERIFY WINDOWS SELF-HOSTED AGENT
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "VERIFYING WINDOWS SELF-HOSTED AGENT"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Agent Name:"
        Write-Host "$(Agent.Name)"

        Write-Host ""
        Write-Host "Agent Machine:"
        Write-Host "$(Agent.MachineName)"

        Write-Host ""
        Write-Host "Agent OS:"
        Write-Host "$(Agent.OS)"

        Write-Host ""
        Write-Host "Agent Version:"
        Write-Host "$(Agent.Version)"

        Write-Host ""
        Write-Host "PowerShell Version:"
        $PSVersionTable.PSVersion

        Write-Host ""
        Write-Host "Operating System:"

        Get-CimInstance Win32_OperatingSystem |
          Select-Object Caption, Version, OSArchitecture |
          Format-Table -AutoSize

        Write-Host ""
        Write-Host "Windows agent verification completed."

      displayName: 'Verify Self-Hosted Windows Agent'


    # =====================================================
    # 3. VERIFY CHECKOUT
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "CHECKOUT VERIFICATION"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Git commit:"

        git rev-parse HEAD

        if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine Git commit."
        }

        Write-Host ""
        Write-Host "Git remote:"

        git remote -v

        Write-Host ""
        Write-Host "Current branch:"

        git branch --show-current

        Write-Host ""
        Write-Host "Repository contents:"

        Get-ChildItem -Force

        Write-Host ""
        Write-Host "Checkout verification completed."

      displayName: 'Verify Checkout'


    # =====================================================
    # 4. VERIFY PYTHON
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "PYTHON VERIFICATION"
        Write-Host "=========================================="

        $pythonCommand = Get-Command python -ErrorAction SilentlyContinue

        if (-not $pythonCommand) {
            $pythonCommand = Get-Command python3 -ErrorAction SilentlyContinue
        }

        if (-not $pythonCommand) {
            throw "Python was not found on the Windows agent."
        }

        Write-Host ""
        Write-Host "Python executable:"
        Write-Host $pythonCommand.Source

        Write-Host ""
        Write-Host "Python version:"

        & $pythonCommand.Source --version

        if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
        }

        Write-Host ""
        Write-Host "Pip version:"

        & $pythonCommand.Source -m pip --version

        if ($LASTEXITCODE -ne 0) {
            throw "Pip verification failed."
        }

        Write-Host ""
        Write-Host "Python verification completed."

      displayName: 'Verify Python'


    # =====================================================
    # 5. CREATE PYTHON VIRTUAL ENVIRONMENT
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "CREATING PYTHON VIRTUAL ENVIRONMENT"
        Write-Host "=========================================="

        if (Test-Path "venv") {

            Write-Host ""
            Write-Host "Removing existing virtual environment..."

            Remove-Item `
              -Recurse `
              -Force `
              "venv"
        }

        $pythonCommand = Get-Command python -ErrorAction SilentlyContinue

        if (-not $pythonCommand) {
            $pythonCommand = Get-Command python3 -ErrorAction SilentlyContinue
        }

        if (-not $pythonCommand) {
            throw "Python was not found."
        }

        Write-Host ""
        Write-Host "Creating virtual environment..."

        & $pythonCommand.Source -m venv venv

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Python virtual environment."
        }

        Write-Host ""
        Write-Host "Python:"

        & ".\venv\Scripts\python.exe" --version

        Write-Host ""
        Write-Host "Pip:"

        & ".\venv\Scripts\python.exe" -m pip --version

        Write-Host ""
        Write-Host "Upgrading pip..."

        & ".\venv\Scripts\python.exe" -m pip install --upgrade pip

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
        }

        Write-Host ""
        Write-Host "Virtual environment created successfully."

      displayName: 'Create Python Virtual Environment'


    # =====================================================
    # 6. INSTALL PYTHON DEPENDENCIES
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "INSTALLING PYTHON DEPENDENCIES"
        Write-Host "=========================================="

        if (-not (Test-Path ".\venv\Scripts\python.exe")) {
            throw "Python virtual environment was not found."
        }

        if (Test-Path "requirements.txt") {

            Write-Host ""
            Write-Host "requirements.txt found."

            & ".\venv\Scripts\python.exe" `
              -m pip install `
              -r requirements.txt

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to install requirements.txt."
            }

        }
        elseif (Test-Path "pyproject.toml") {

            Write-Host ""
            Write-Host "pyproject.toml found."

            & ".\venv\Scripts\python.exe" `
              -m pip install .

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to install Python package."
            }

        }
        else {

            Write-Host ""
            Write-Host "ERROR: No requirements.txt or pyproject.toml found."

            Write-Host ""
            Write-Host "Repository files:"

            Get-ChildItem -Recurse -File |
              Select-Object -First 100 FullName

            throw "Python dependency definition was not found."

        }

        Write-Host ""
        Write-Host "Dependencies installed successfully."

      displayName: 'Install Python Dependencies'


    # =====================================================
    # 7. VERIFY CHUNKHOUND REPOSITORY
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "VERIFYING CHUNKHOUND REPOSITORY"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Repository root:"

        Get-Location

        Write-Host ""
        Write-Host "Top-level directories:"

        Get-ChildItem -Directory |
          Select-Object Name

        Write-Host ""
        Write-Host "Top-level files:"

        Get-ChildItem -File |
          Select-Object Name

        Write-Host ""
        Write-Host "Source directory check:"

        if (Test-Path "src" -PathType Container) {

            Write-Host "src directory found."

        }
        else {

            Write-Host "WARNING: src directory was not found."

            Write-Host "This will not stop artifact creation."

        }

        Write-Host ""
        Write-Host "Repository verification completed."

      displayName: 'Verify ChunkHound Repository'


    # =====================================================
    # 8. CREATE CHUNKHOUND ARTIFACT
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "CREATING CHUNKHOUND ARTIFACT"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Build ID:"
        Write-Host "$(Build.BuildId)"

        Write-Host ""
        Write-Host "Application Version:"
        Write-Host "$(APP_VERSION)"

        Write-Host ""
        Write-Host "Artifact:"
        Write-Host "$(ARTIFACT_FILE)"

        # -------------------------------------------------
        # CLEAN ARTIFACT DIRECTORY
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Cleaning artifact directory..."

        if (Test-Path "$(ARTIFACT_DIR)") {

            Remove-Item `
              -Recurse `
              -Force `
              "$(ARTIFACT_DIR)"
        }

        New-Item `
          -ItemType Directory `
          -Path "$(ARTIFACT_DIR)" `
          -Force | Out-Null

        # -------------------------------------------------
        # ARTIFACT PATH
        # -------------------------------------------------

        $artifactPath = Join-Path `
          "$(ARTIFACT_DIR)" `
          "$(ARTIFACT_FILE)"

        Write-Host ""
        Write-Host "Artifact path:"
        Write-Host $artifactPath

        # -------------------------------------------------
        # VERIFY TAR
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Checking tar command..."

        $tarCommand = Get-Command tar -ErrorAction SilentlyContinue

        if (-not $tarCommand) {
            throw "tar command was not found on the Windows agent."
        }

        Write-Host ""
        Write-Host "tar location:"
        Write-Host $tarCommand.Source

        # -------------------------------------------------
        # CREATE TAR.GZ
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Creating tar.gz artifact..."

        & tar `
          --exclude=".git" `
          --exclude="venv" `
          --exclude="artifacts" `
          --exclude="__pycache__" `
          --exclude="*.pyc" `
          -czf `
          $artifactPath `
          .

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tar.gz artifact."
        }

        # -------------------------------------------------
        # VERIFY FILE
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Verifying artifact file..."

        if (-not (Test-Path $artifactPath -PathType Leaf)) {
            throw "Artifact was not created."
        }

        $artifactInfo = Get-Item $artifactPath

        if ($artifactInfo.Length -le 0) {
            throw "Artifact was created but has zero bytes."
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ARTIFACT CREATED SUCCESSFULLY"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Artifact:"
        Write-Host $artifactInfo.FullName

        Write-Host ""
        Write-Host "Artifact size:"
        Write-Host "$([math]::Round($artifactInfo.Length / 1MB, 2)) MB"

        Write-Host ""
        Write-Host "Artifact size in bytes:"
        Write-Host $artifactInfo.Length

        # -------------------------------------------------
        # OPTIONAL INSPECTION
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Inspecting artifact contents..."

        try {

            $contents = & tar -tzf $artifactPath 2>&1

            if ($LASTEXITCODE -eq 0) {

                Write-Host ""
                Write-Host "First 50 entries:"

                $contents |
                  Select-Object -First 50

                Write-Host ""
                Write-Host "Artifact inspection successful."

            }
            else {

                Write-Host ""
                Write-Host "WARNING: Artifact inspection returned an error."

                Write-Host ""
                Write-Host "The artifact itself was successfully created."

                Write-Host ""
                Write-Host "Continuing pipeline..."

            }

        }
        catch {

            Write-Host ""
            Write-Host "WARNING: Artifact inspection failed."

            Write-Host ""
            Write-Host "Artifact exists and has a non-zero size."

            Write-Host ""
            Write-Host "Continuing pipeline..."

        }

        # -------------------------------------------------
        # FINAL CHECK
        # -------------------------------------------------

        Write-Host ""
        Write-Host "Final artifact check..."

        if (
            (Test-Path $artifactPath -PathType Leaf) -and
            ((Get-Item $artifactPath).Length -gt 0)
        ) {

            Write-Host ""
            Write-Host "Artifact is ready for publishing."

        }
        else {

            throw "Final artifact verification failed."

        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ARTIFACT CREATION COMPLETED"
        Write-Host "=========================================="

      displayName: 'Create ChunkHound Artifact'


    # =====================================================
    # 9. PUBLISH ARTIFACT TO AZURE DEVOPS
    # =====================================================

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Artifact to Azure DevOps'

      inputs:

        targetPath: '$(Build.SourcesDirectory)\$(ARTIFACT_DIR)'

        artifact: 'chunkhound-artifact'

        publishLocation: 'pipeline'


    # =====================================================
    # 10. INSTALL / VERIFY ORAS
    # =====================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "INSTALLING / VERIFYING ORAS"
        Write-Host "=========================================="

        $orasVersion = "1.2.0"

        $orasDirectory = Join-Path `
          $env:USERPROFILE `
          "oras"

        $orasExe = Join-Path `
          $orasDirectory `
          "oras.exe"

        if (-not (Test-Path $orasDirectory)) {

            New-Item `
              -ItemType Directory `
              -Path $orasDirectory `
              -Force | Out-Null

        }

        # -------------------------------------------------
        # CHECK ORAS
        # -------------------------------------------------

        $existingOras = Get-Command oras `
          -ErrorAction SilentlyContinue

        if ($existingOras) {

            Write-Host ""
            Write-Host "ORAS is already installed."

            Write-Host ""
            Write-Host "ORAS location:"
            Write-Host $existingOras.Source

            & $existingOras.Source version

            if ($LASTEXITCODE -ne 0) {
                throw "ORAS verification failed."
            }

        }
        elseif (Test-Path $orasExe) {

            Write-Host ""
            Write-Host "ORAS executable already exists."

            & $orasExe version

            if ($LASTEXITCODE -ne 0) {
                throw "ORAS verification failed."
            }

        }
        else {

            Write-Host ""
            Write-Host "ORAS is not installed."

            $downloadUrl = "https://github.com/oras-project/oras/releases/download/v$orasVersion/oras_${orasVersion}_windows_amd64.zip"

            $zipPath = Join-Path `
              $env:TEMP `
              "oras.zip"

            $extractPath = Join-Path `
              $env:TEMP `
              "oras-extract"

            Write-Host ""
            Write-Host "Downloading ORAS $orasVersion..."

            Invoke-WebRequest `
              -Uri $downloadUrl `
              -OutFile $zipPath

            if (-not (Test-Path $zipPath)) {
                throw "ORAS download failed."
            }

            Write-Host ""
            Write-Host "Extracting ORAS..."

            if (Test-Path $extractPath) {

                Remove-Item `
                  -Recurse `
                  -Force `
                  $extractPath

            }

            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $extractPath `
              -Force

            $downloadedOras = Join-Path `
              $extractPath `
              "oras.exe"

            if (-not (Test-Path $downloadedOras)) {
                throw "oras.exe was not found after extraction."
            }

            Copy-Item `
              -Path $downloadedOras `
              -Destination $orasExe `
              -Force

            Write-Host ""
            Write-Host "ORAS installed successfully."

        }

        $env:PATH = "$orasDirectory;$env:PATH"

        Write-Host ""
        Write-Host "ORAS version:"

        & $orasExe version

        if ($LASTEXITCODE -ne 0) {
            throw "ORAS verification failed."
        }

        Write-Host ""
        Write-Host "ORAS verification completed."

      displayName: 'Install and Verify ORAS'


    # =====================================================
    # 11. AZURE BLOB + ACR
    # =====================================================

    - task: AzureCLI@2

      displayName: 'Upload Artifact to Azure Blob and ACR'

      inputs:

        azureSubscription: 'batch13-connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        addSpnToEnvironment: false

        powerShellErrorActionPreference: 'stop'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "AZURE ACCOUNT"
          Write-Host "=========================================="

          az account show `
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Azure account verification failed."
          }


          # =================================================
          # VARIABLES
          # =================================================

          $artifactPath = "$(Build.SourcesDirectory)\$(ARTIFACT_DIR)\$(ARTIFACT_FILE)"

          $version = "$(APP_VERSION)"

          $versionedBlob = "chunkhound/$version/$(ARTIFACT_FILE)"

          $latestBlob = "chunkhound/latest/$(ARTIFACT_FILE)"

          $versionTag = "$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):$version"

          $latestTag = "$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):latest"


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PIPELINE VARIABLES"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Build ID:"
          Write-Host "$(Build.BuildId)"

          Write-Host ""
          Write-Host "Application Version:"
          Write-Host $version

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifactPath

          Write-Host ""
          Write-Host "Resource Group:"
          Write-Host "$(RESOURCE_GROUP)"

          Write-Host ""
          Write-Host "Storage Account:"
          Write-Host "$(STORAGE_ACCOUNT)"

          Write-Host ""
          Write-Host "Storage Container:"
          Write-Host "$(STORAGE_CONTAINER)"

          Write-Host ""
          Write-Host "ACR:"
          Write-Host "$(ACR_LOGIN_SERVER)"

          Write-Host ""
          Write-Host "ACR Repository:"
          Write-Host "$(ACR_REPOSITORY)"


          # =================================================
          # VERIFY ARTIFACT
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFY ARTIFACT"
          Write-Host "=========================================="

          if (-not (Test-Path $artifactPath -PathType Leaf)) {
              throw "Artifact does not exist: $artifactPath"
          }

          $artifactInfo = Get-Item $artifactPath

          Write-Host ""
          Write-Host "Artifact found."

          Write-Host ""
          Write-Host "Artifact size:"
          Write-Host "$([math]::Round($artifactInfo.Length / 1MB, 2)) MB"


          # =================================================
          # VERIFY RESOURCE GROUP
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFY RESOURCE GROUP"
          Write-Host "=========================================="

          az group show `
            --name "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Resource group verification failed."
          }

          Write-Host ""
          Write-Host "Resource group verified."


          # =================================================
          # VERIFY STORAGE ACCOUNT
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFY STORAGE ACCOUNT"
          Write-Host "=========================================="

          az storage account show `
            --name "$(STORAGE_ACCOUNT)" `
            --resource-group "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Storage account verification failed."
          }

          Write-Host ""
          Write-Host "Storage account verified."


          # =================================================
          # VERIFY STORAGE CONTAINER
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFY STORAGE CONTAINER"
          Write-Host "=========================================="

          az storage container show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --name "$(STORAGE_CONTAINER)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Storage container verification failed."
          }

          Write-Host ""
          Write-Host "Storage container verified."


          # =================================================
          # UPLOAD VERSIONED BLOB
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UPLOADING VERSIONED BLOB"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Blob:"
          Write-Host $versionedBlob

          az storage blob upload `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $versionedBlob `
            --file $artifactPath `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              throw "Versioned Blob upload failed."
          }

          Write-Host ""
          Write-Host "Versioned Blob upload completed."


          # =================================================
          # UPLOAD LATEST BLOB
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UPLOADING LATEST BLOB"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Blob:"
          Write-Host $latestBlob

          az storage blob upload `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $latestBlob `
            --file $artifactPath `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              throw "Latest Blob upload failed."
          }

          Write-Host ""
          Write-Host "Latest Blob upload completed."


          # =================================================
          # VERIFY VERSIONED BLOB
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING VERSIONED BLOB"
          Write-Host "=========================================="

          az storage blob show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $versionedBlob `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Versioned Blob verification failed."
          }

          Write-Host ""
          Write-Host "Versioned Blob verified."


          # =================================================
          # VERIFY LATEST BLOB
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING LATEST BLOB"
          Write-Host "=========================================="

          az storage blob show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $latestBlob `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Latest Blob verification failed."
          }

          Write-Host ""
          Write-Host "Latest Blob verified."


          # =================================================
          # VERIFY ACR
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING ACR"
          Write-Host "=========================================="

          az acr show `
            --name "$(ACR_NAME)" `
            --resource-group "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "ACR verification failed."
          }

          Write-Host ""
          Write-Host "ACR verified."


          # =================================================
          # GET ACR TOKEN
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GETTING ACR ACCESS TOKEN"
          Write-Host "=========================================="

          $acrToken = az acr login `
            --name "$(ACR_NAME)" `
            --expose-token `
            --query accessToken `
            --output tsv

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to obtain ACR access token."
          }

          if ([string]::IsNullOrWhiteSpace($acrToken)) {
              throw "ACR access token is empty."
          }

          Write-Host ""
          Write-Host "ACR access token obtained."


          # =================================================
          # VERIFY ORAS
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING ORAS"
          Write-Host "=========================================="

          $orasPath = Join-Path `
            $env:USERPROFILE `
            "oras\oras.exe"

          if (-not (Test-Path $orasPath)) {

              $orasCommand = Get-Command oras `
                -ErrorAction SilentlyContinue

              if ($orasCommand) {
                  $orasPath = $orasCommand.Source
              }

          }

          if (-not (Test-Path $orasPath)) {
              throw "ORAS executable was not found."
          }

          Write-Host ""
          Write-Host "ORAS:"
          Write-Host $orasPath

          & $orasPath version

          if ($LASTEXITCODE -ne 0) {
              throw "ORAS verification failed."
          }


          # =================================================
          # LOGIN TO ACR USING ORAS
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LOGIN TO ACR USING ORAS"
          Write-Host "=========================================="

          $acrUsername = "00000000-0000-0000-0000-000000000000"

          $acrToken |
            & $orasPath login `
              "$(ACR_LOGIN_SERVER)" `
              --username $acrUsername `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
              throw "ORAS ACR login failed."
          }

          Write-Host ""
          Write-Host "ORAS ACR login successful."


          # =================================================
          # PUSH VERSION
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PUSHING VERSIONED ARTIFACT TO ACR"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Target:"
          Write-Host $versionTag

          & $orasPath push `
            $versionTag `
            "${artifactPath}:application/gzip"

          if ($LASTEXITCODE -ne 0) {
              throw "Versioned ORAS push failed."
          }

          Write-Host ""
          Write-Host "Versioned artifact pushed successfully."


          # =================================================
          # PUSH LATEST
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PUSHING LATEST ARTIFACT TO ACR"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Target:"
          Write-Host $latestTag

          & $orasPath push `
            $latestTag `
            "${artifactPath}:application/gzip"

          if ($LASTEXITCODE -ne 0) {
              throw "Latest ORAS push failed."
          }

          Write-Host ""
          Write-Host "Latest artifact pushed successfully."


          # =================================================
          # VERIFY ACR REPOSITORY
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING ACR REPOSITORY"
          Write-Host "=========================================="

          az acr repository show `
            --name "$(ACR_NAME)" `
            --repository "$(ACR_REPOSITORY)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "ACR repository verification failed."
          }

          Write-Host ""
          Write-Host "ACR repository verified."


          # =================================================
          # VERIFY ACR TAGS
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING ACR TAGS"
          Write-Host "=========================================="

          az acr repository show-tags `
            --name "$(ACR_NAME)" `
            --repository "$(ACR_REPOSITORY)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "ACR tag verification failed."
          }

          Write-Host ""
          Write-Host "ACR tags verified."


          # =================================================
          # SUCCESS
          # =================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CHUNKHOUND PIPELINE SUCCESS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Build ID:"
          Write-Host "$(Build.BuildId)"

          Write-Host ""
          Write-Host "Application Version:"
          Write-Host $version

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "$(ARTIFACT_FILE)"

          Write-Host ""
          Write-Host "Storage Account:"
          Write-Host "$(STORAGE_ACCOUNT)"

          Write-Host ""
          Write-Host "Versioned Blob:"
          Write-Host $versionedBlob

          Write-Host ""
          Write-Host "Latest Blob:"
          Write-Host $latestBlob

          Write-Host ""
          Write-Host "ACR:"
          Write-Host "$(ACR_LOGIN_SERVER)"

          Write-Host ""
          Write-Host "ACR Repository:"
          Write-Host "$(ACR_REPOSITORY)"

          Write-Host ""
          Write-Host "ACR Version:"
          Write-Host $version

          Write-Host ""
          Write-Host "ACR Latest:"
          Write-Host "latest"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          PIPELINE COMPLETED"
          Write-Host "=========================================="

      #displayName: 'Upload Artifact to Azure Blob and ACR'
