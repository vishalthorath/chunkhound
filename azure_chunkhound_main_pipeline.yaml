trigger: none

pool:
  name: batch13-pool

variables:
  azureServiceConnection: 'batch13-connection'
  acrName: 'vishalacr2026'

stages:

- stage: Verify
  displayName: 'Verify Azure and ACR'

  jobs:

  - job: VerifyAzure
    displayName: 'Verify Azure Service Connection'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Verify Azure Subscription'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "AZURE SUBSCRIPTION"
          Write-Host "=========================================="

          az account show `
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" `
            -o table

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "EXPECTED SUBSCRIPTION"
          Write-Host "=========================================="

          Write-Host "95ccfd41-64bd-478c-bfe7-9c2efe238b82"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CHECKING ACR"
          Write-Host "=========================================="

          az acr show `
            --name "$(acrName)" `
            --query "{Name:name, LoginServer:loginServer, ResourceGroup:resourceGroup, Subscription:id}" `
            -o table

          if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "ERROR: Cannot access vishalacr2026"
              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ACR ACCESS SUCCESSFUL"
          Write-Host "=========================================="
