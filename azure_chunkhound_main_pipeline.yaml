trigger:
  branches:
    include:
      - main

pr: none

# =========================================================
# SELF-HOSTED UBUNTU AGENT
# =========================================================

pool:
  name: 'batch13-pool'

variables:

  # =========================================================
  # AZURE
  # =========================================================

  RESOURCE_GROUP: 'VT-RG'
  STORAGE_ACCOUNT: 'vishalsa007'
  STORAGE_CONTAINER: 'chunkhound-artifacts'

  # =========================================================
  # AZURE CONTAINER REGISTRY
  # =========================================================

  ACR_NAME: 'vishalacr2026'
  ACR_LOGIN_SERVER: 'vishalacr2026.azurecr.io'
  ACR_REPOSITORY: 'chunkhound-artifact'

  # =========================================================
  # ARTIFACT
  # =========================================================

  ARTIFACT_DIR: 'artifacts'

  # Build 1 = 0.1
  # Build 2 = 0.2
  # Build 3 = 0.3

  APP_VERSION: '0.$(Build.BuildId)'
  ARTIFACT_FILE: 'chunkhound-$(Build.BuildId).tar.gz'


stages:

# =========================================================
# CHUNKHOUND BUILD AND PUBLISH
# =========================================================

- stage: ChunkHoundBuildAndPublish

  displayName: 'ChunkHound Build and Publish'

  jobs:

  - job: BuildAndPublish

    displayName: 'Build Artifact and Publish to Azure'

    steps:

    # =====================================================
    # 1. CHECKOUT
    # =====================================================

    - checkout: self

      displayName: 'Checkout Repository'


    # =====================================================
    # 2. VERIFY AGENT
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "VERIFYING AZURE DEVOPS AGENT"
        echo "=========================================="

        echo ""
        echo "Agent Name:"
        echo "$(Agent.Name)"

        echo ""
        echo "Agent Machine:"
        echo "$(Agent.MachineName)"

        echo ""
        echo "Agent OS:"
        echo "$(Agent.OS)"

        echo ""
        echo "Agent Version:"
        echo "$(Agent.Version)"

        echo ""
        echo "Working Directory:"
        echo "$(Agent.BuildDirectory)"

        echo ""
        echo "Operating System:"
        uname -a

        echo ""
        echo "Ubuntu Version:"
        cat /etc/os-release

        echo ""
        echo "=========================================="
        echo "AGENT VERIFICATION COMPLETED"
        echo "=========================================="

      displayName: 'Verify Self-Hosted Ubuntu Agent'


    # =====================================================
    # 3. VERIFY CHECKOUT
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "CHECKOUT VERIFICATION"
        echo "=========================================="

        echo ""
        echo "Commit:"
        git rev-parse HEAD

        echo ""
        echo "Remote:"
        git remote -v

        echo ""
        echo "Branch:"
        git branch --show-current

        echo ""
        echo "Repository contents:"
        ls -la

        echo ""
        echo "Checkout verification completed."

      displayName: 'Verify Checkout'


    # =====================================================
    # 4. VERIFY PYTHON
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "PYTHON VERIFICATION"
        echo "=========================================="

        echo ""
        echo "Python:"
        python3 --version

        echo ""
        echo "Pip:"
        python3 -m pip --version

        echo ""
        echo "Python location:"
        which python3

        echo ""
        echo "Python verification completed."

      displayName: 'Verify Python'


    # =====================================================
    # 5. CREATE VIRTUAL ENVIRONMENT
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "CREATING PYTHON VIRTUAL ENVIRONMENT"
        echo "=========================================="

        rm -rf venv

        python3 -m venv venv

        source venv/bin/activate

        echo ""
        echo "Python:"
        python --version

        echo ""
        echo "Pip:"
        pip --version

        echo ""
        echo "Upgrading pip..."

        python -m pip install --upgrade pip

        echo ""
        echo "Virtual environment created successfully."

      displayName: 'Create Python Virtual Environment'


    # =====================================================
    # 6. INSTALL DEPENDENCIES
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "INSTALLING PYTHON DEPENDENCIES"
        echo "=========================================="

        source venv/bin/activate

        if [ -f requirements.txt ]; then

          echo ""
          echo "requirements.txt found."

          pip install -r requirements.txt

        elif [ -f pyproject.toml ]; then

          echo ""
          echo "pyproject.toml found."

          pip install .

        else

          echo ""
          echo "ERROR: No requirements.txt or pyproject.toml found."

          echo ""
          echo "Repository files:"

          find . -maxdepth 2 -type f | sort | head -100

          exit 1

        fi

        echo ""
        echo "Dependencies installed successfully."

      displayName: 'Install Python Dependencies'


    # =====================================================
    # 7. VERIFY CHUNKHOUND SOURCE
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "VERIFYING CHUNKHOUND SOURCE"
        echo "=========================================="

        if [ ! -d "chunkhound" ]; then

          echo ""
          echo "ERROR: chunkhound directory was not found."

          echo ""
          echo "Repository structure:"

          find . -maxdepth 2 -type d | sort

          echo ""
          echo "Top-level files:"

          find . -maxdepth 2 -type f | sort | head -100

          exit 1

        fi

        echo ""
        echo "chunkhound directory found."

        echo ""
        echo "ChunkHound contents:"

        ls -la chunkhound

        echo ""
        echo "Source verification completed."

      displayName: 'Verify ChunkHound Source'


    # =====================================================
    # 8. CREATE ARTIFACT
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "CREATING CHUNKHOUND ARTIFACT"
        echo "=========================================="

        echo ""
        echo "Build ID:"
        echo "$(Build.BuildId)"

        echo ""
        echo "Application Version:"
        echo "$(APP_VERSION)"

        echo ""
        echo "Artifact:"
        echo "$(ARTIFACT_FILE)"

        echo ""
        echo "Cleaning artifact directory..."

        rm -rf "$(ARTIFACT_DIR)"

        mkdir -p "$(ARTIFACT_DIR)"

        echo ""
        echo "Creating tar.gz artifact..."

        tar \
          --exclude='./.git' \
          --exclude='./venv' \
          --exclude='./artifacts' \
          --exclude='./__pycache__' \
          --exclude='*/__pycache__' \
          --exclude='*.pyc' \
          -czf "$(ARTIFACT_DIR)/$(ARTIFACT_FILE)" .

        echo ""
        echo "Artifact created successfully."

        echo ""
        echo "Artifact details:"

        ls -lh "$(ARTIFACT_DIR)/$(ARTIFACT_FILE)"

        echo ""
        echo "Artifact size:"

        du -h "$(ARTIFACT_DIR)/$(ARTIFACT_FILE)"

        echo ""
        echo "First 50 files inside artifact:"

        tar -tzf "$(ARTIFACT_DIR)/$(ARTIFACT_FILE)" | head -50

        echo ""
        echo "Artifact creation completed."

      displayName: 'Create ChunkHound Artifact'


    # =====================================================
    # 9. PUBLISH ARTIFACT TO AZURE DEVOPS
    # =====================================================

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Artifact to Azure DevOps'

      inputs:

        targetPath: '$(Build.SourcesDirectory)/$(ARTIFACT_DIR)'

        artifact: 'chunkhound-artifact'

        publishLocation: 'pipeline'


    # =====================================================
    # 10. INSTALL / VERIFY ORAS
    # =====================================================

    - bash: |

        set -e

        echo "=========================================="
        echo "INSTALLING / VERIFYING ORAS"
        echo "=========================================="

        ORAS_VERSION="1.2.0"

        mkdir -p "$HOME/bin"

        export PATH="$HOME/bin:$PATH"

        if command -v oras >/dev/null 2>&1; then

          echo ""
          echo "ORAS is already installed."

        else

          echo ""
          echo "ORAS is not installed."

          echo ""
          echo "Downloading ORAS ${ORAS_VERSION}..."

          curl -fL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/oras.tar.gz

          echo ""
          echo "Extracting ORAS..."

          rm -rf /tmp/oras-install

          mkdir -p /tmp/oras-install

          tar \
            -xzf /tmp/oras.tar.gz \
            -C /tmp/oras-install

          echo ""
          echo "Installing ORAS..."

          install \
            /tmp/oras-install/oras \
            "$HOME/bin/oras"

        fi

        echo ""
        echo "ORAS location:"

        which oras

        echo ""
        echo "ORAS version:"

        oras version

        echo ""
        echo "ORAS verification completed."

      displayName: 'Install and Verify ORAS'


    # =====================================================
    # 11. AZURE BLOB STORAGE + ACR
    # =====================================================

    - task: AzureCLI@2

      displayName: 'Upload Artifact to Azure Blob and ACR'

      inputs:

        azureSubscription: 'batch13-connection'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        addSpnToEnvironment: false

        inlineScript: |

          set -e

          # Make ORAS available inside this task
          export PATH="$HOME/bin:$PATH"

          echo "=========================================="
          echo "AZURE ACCOUNT"
          echo "=========================================="

          az account show \
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" \
            --output table


          # =================================================
          # VARIABLES
          # =================================================

          ARTIFACT_PATH="$(Build.SourcesDirectory)/$(ARTIFACT_DIR)/$(ARTIFACT_FILE)"

          VERSION="$(APP_VERSION)"

          VERSIONED_BLOB="chunkhound/${VERSION}/$(ARTIFACT_FILE)"

          LATEST_BLOB="chunkhound/latest/$(ARTIFACT_FILE)"

          VERSION_TAG="$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):${VERSION}"

          LATEST_TAG="$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):latest"


          echo ""
          echo "=========================================="
          echo "PIPELINE VARIABLES"
          echo "=========================================="

          echo ""
          echo "Build ID:"
          echo "$(Build.BuildId)"

          echo ""
          echo "Application Version:"
          echo "$VERSION"

          echo ""
          echo "Artifact:"
          echo "$ARTIFACT_PATH"

          echo ""
          echo "Resource Group:"
          echo "$(RESOURCE_GROUP)"

          echo ""
          echo "Storage Account:"
          echo "$(STORAGE_ACCOUNT)"

          echo ""
          echo "Storage Container:"
          echo "$(STORAGE_CONTAINER)"

          echo ""
          echo "ACR:"
          echo "$(ACR_LOGIN_SERVER)"

          echo ""
          echo "ACR Repository:"
          echo "$(ACR_REPOSITORY)"


          # =================================================
          # VERIFY ARTIFACT
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFY ARTIFACT"
          echo "=========================================="

          if [ ! -f "$ARTIFACT_PATH" ]; then

            echo ""
            echo "ERROR: Artifact does not exist."

            echo ""
            echo "Artifact directory:"

            ls -la \
              "$(Build.SourcesDirectory)/$(ARTIFACT_DIR)" \
              || true

            exit 1

          fi

          echo ""
          echo "Artifact found."

          ls -lh "$ARTIFACT_PATH"


          # =================================================
          # VERIFY RESOURCE GROUP
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFY RESOURCE GROUP"
          echo "=========================================="

          az group show \
            --name "$(RESOURCE_GROUP)" \
            --output table

          echo ""
          echo "Resource group verified."


          # =================================================
          # VERIFY STORAGE ACCOUNT
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFY STORAGE ACCOUNT"
          echo "=========================================="

          az storage account show \
            --name "$(STORAGE_ACCOUNT)" \
            --resource-group "$(RESOURCE_GROUP)" \
            --output table

          echo ""
          echo "Storage account verified."


          # =================================================
          # VERIFY STORAGE CONTAINER
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFY STORAGE CONTAINER"
          echo "=========================================="

          az storage container show \
            --auth-mode login \
            --account-name "$(STORAGE_ACCOUNT)" \
            --name "$(STORAGE_CONTAINER)" \
            --output table

          echo ""
          echo "Storage container verified."


          # =================================================
          # UPLOAD VERSIONED BLOB
          # =================================================

          echo ""
          echo "=========================================="
          echo "UPLOADING VERSIONED BLOB"
          echo "=========================================="

          echo ""
          echo "Blob:"
          echo "$VERSIONED_BLOB"

          az storage blob upload \
            --auth-mode login \
            --account-name "$(STORAGE_ACCOUNT)" \
            --container-name "$(STORAGE_CONTAINER)" \
            --name "$VERSIONED_BLOB" \
            --file "$ARTIFACT_PATH" \
            --overwrite true

          echo ""
          echo "Versioned Blob upload completed."


          # =================================================
          # UPLOAD LATEST BLOB
          # =================================================

          echo ""
          echo "=========================================="
          echo "UPLOADING LATEST BLOB"
          echo "=========================================="

          echo ""
          echo "Blob:"
          echo "$LATEST_BLOB"

          az storage blob upload \
            --auth-mode login \
            --account-name "$(STORAGE_ACCOUNT)" \
            --container-name "$(STORAGE_CONTAINER)" \
            --name "$LATEST_BLOB" \
            --file "$ARTIFACT_PATH" \
            --overwrite true

          echo ""
          echo "Latest Blob upload completed."


          # =================================================
          # VERIFY VERSIONED BLOB
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING VERSIONED BLOB"
          echo "=========================================="

          az storage blob show \
            --auth-mode login \
            --account-name "$(STORAGE_ACCOUNT)" \
            --container-name "$(STORAGE_CONTAINER)" \
            --name "$VERSIONED_BLOB" \
            --output table

          echo ""
          echo "Versioned Blob verified."


          # =================================================
          # VERIFY LATEST BLOB
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING LATEST BLOB"
          echo "=========================================="

          az storage blob show \
            --auth-mode login \
            --account-name "$(STORAGE_ACCOUNT)" \
            --container-name "$(STORAGE_CONTAINER)" \
            --name "$LATEST_BLOB" \
            --output table

          echo ""
          echo "Latest Blob verified."


          # =================================================
          # VERIFY ACR
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING ACR"
          echo "=========================================="

          az acr show \
            --name "$(ACR_NAME)" \
            --resource-group "$(RESOURCE_GROUP)" \
            --output table

          echo ""
          echo "ACR verified."


          # =================================================
          # LOGIN TO ACR
          # =================================================

          echo ""
          echo "=========================================="
          echo "LOGIN TO ACR"
          echo "=========================================="

          az acr login \
            --name "$(ACR_NAME)"

          echo ""
          echo "ACR login successful."


          # =================================================
          # VERIFY ORAS
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING ORAS"
          echo "=========================================="

          which oras

          oras version


          # =================================================
          # PUSH VERSIONED ARTIFACT
          # =================================================

          echo ""
          echo "=========================================="
          echo "PUSHING VERSIONED ARTIFACT TO ACR"
          echo "=========================================="

          echo ""
          echo "Target:"
          echo "$VERSION_TAG"

          oras push \
            "$VERSION_TAG" \
            "$ARTIFACT_PATH:application/gzip"

          echo ""
          echo "Versioned ORAS artifact pushed successfully."


          # =================================================
          # PUSH LATEST ARTIFACT
          # =================================================

          echo ""
          echo "=========================================="
          echo "PUSHING LATEST ARTIFACT TO ACR"
          echo "=========================================="

          echo ""
          echo "Target:"
          echo "$LATEST_TAG"

          oras push \
            "$LATEST_TAG" \
            "$ARTIFACT_PATH:application/gzip"

          echo ""
          echo "Latest ORAS artifact pushed successfully."


          # =================================================
          # VERIFY ACR REPOSITORY
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING ACR REPOSITORY"
          echo "=========================================="

          az acr repository show \
            --name "$(ACR_NAME)" \
            --repository "$(ACR_REPOSITORY)" \
            --output table

          echo ""
          echo "ACR repository verified."


          # =================================================
          # VERIFY ACR TAGS
          # =================================================

          echo ""
          echo "=========================================="
          echo "VERIFYING ACR TAGS"
          echo "=========================================="

          az acr repository show-tags \
            --name "$(ACR_NAME)" \
            --repository "$(ACR_REPOSITORY)" \
            --output table

          echo ""
          echo "ACR tags verified."


          # =================================================
          # FINAL SUCCESS
          # =================================================

          echo ""
          echo "=========================================="
          echo "       CHUNKHOUND PIPELINE SUCCESS"
          echo "=========================================="

          echo ""
          echo "Build ID:"
          echo "$(Build.BuildId)"

          echo ""
          echo "Application Version:"
          echo "$VERSION"

          echo ""
          echo "Artifact:"
          echo "$(ARTIFACT_FILE)"

          echo ""
          echo "Versioned Blob:"
          echo "$VERSIONED_BLOB"

          echo ""
          echo "Latest Blob:"
          echo "$LATEST_BLOB"

          echo ""
          echo "ACR:"
          echo "$(ACR_LOGIN_SERVER)"

          echo ""
          echo "ACR Repository:"
          echo "$(ACR_REPOSITORY)"

          echo ""
          echo "ACR Version:"
          echo "$VERSION"

          echo ""
          echo "ACR Latest:"
          echo "latest"

          echo ""
          echo "=========================================="
          echo "          PIPELINE COMPLETED"
          echo "=========================================="

     
