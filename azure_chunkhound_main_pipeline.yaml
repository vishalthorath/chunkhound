trigger:
- main

pool:
  name: batch13-pool

variables:
  artifactName: 'application-artifact'
  artifactFile: 'application-artifact.tar.gz'

stages:

- stage: Build
  displayName: 'Stage 1 - Build Artifact'

  jobs:

  - job: BuildArtifact
    displayName: 'Build Application Artifact'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - powershell: |

        Write-Host "=========================================="
        Write-Host "SOURCE CODE"
        Write-Host "=========================================="

        Get-ChildItem "$(Build.SourcesDirectory)" -Force

    - powershell: |

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\artifact"

        if (Test-Path $artifactDirectory) {
            Remove-Item $artifactDirectory -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $artifactDirectory `
          -Force | Out-Null

        Write-Host "Artifact directory created:"
        Write-Host $artifactDirectory

    - powershell: |

        $source = "$(Build.SourcesDirectory)"
        $destination = "$(Build.ArtifactStagingDirectory)\artifact"

        Write-Host "Copying application files..."

        Get-ChildItem `
          -Path $source `
          -Exclude ".git" |
          Copy-Item `
          -Destination $destination `
          -Recurse `
          -Force

        Write-Host "Application files copied."

    - powershell: |

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\artifact"
        $outputFile = "$(Build.ArtifactStagingDirectory)\$(artifactFile)"

        Write-Host "Creating TAR.GZ artifact..."

        tar.exe -czf "$outputFile" -C "$artifactDirectory" .

        if ($LASTEXITCODE -ne 0) {
            throw "Artifact creation failed."
        }

        if (-not (Test-Path $outputFile)) {
            throw "Artifact file was not created."
        }

        Write-Host "=========================================="
        Write-Host "ARTIFACT CREATED"
        Write-Host "=========================================="

        Get-Item "$outputFile" |
          Select-Object FullName, Length

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\$(artifactFile)'
        artifact: '$(artifactName)'
        publishLocation: 'pipeline'
