trigger:
  branches:
    include:
      - main

pool:
  name: batch13-pool

variables:
  # ============================================================
  # Azure
  # ============================================================
  azureServiceConnection: 'batch13-connection'

  # ============================================================
  # Azure Container Registry
  # ============================================================
  acrName: 'vishalacr2026'
  acrLoginServer: 'vishalacr2026.azurecr.io'

  # ============================================================
  # Application
  # ============================================================
  imageName: 'chunkhound'

  # ============================================================
  # Version
  # ============================================================
  majorVersion: '0'


stages:

# ============================================================
# STAGE 1 - VERIFY AGENT AND AZURE SUBSCRIPTION
# ============================================================
- stage: Verify
  displayName: 'Verify Agent and Azure Subscription'

  jobs:
  - job: VerifyEnvironment
    displayName: 'Verify Environment'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Verify Windows Agent
    # --------------------------------------------------------
    - powershell: |
        Write-Host "======================================"
        Write-Host "Agent Information"
        Write-Host "======================================"

        Write-Host "Agent Name: $(Agent.Name)"
        Write-Host "Agent OS: $(Agent.OS)"
        Write-Host "Agent Version: $(Agent.Version)"
        Write-Host ""

        Write-Host "======================================"
        Write-Host "Working Directory"
        Write-Host "======================================"

        Get-Location
        Write-Host ""

        Write-Host "======================================"
        Write-Host "Git Version"
        Write-Host "======================================"

        git --version

      displayName: 'Verify Windows Agent'


    # --------------------------------------------------------
    # Verify Azure Subscription
    # --------------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Verify New Azure Subscription'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "======================================"
          Write-Host "Azure Account"
          Write-Host "======================================"

          az account show `
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" `
            -o table

          Write-Host ""

          Write-Host "======================================"
          Write-Host "Azure CLI Version"
          Write-Host "======================================"

          az version

          Write-Host ""
          Write-Host "Azure subscription verification completed successfully."


# ============================================================
# STAGE 2 - BUILD
# ============================================================
- stage: Build
  displayName: 'Build Application'

  dependsOn: Verify

  jobs:
  - job: BuildApplication
    displayName: 'Build ChunkHound'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Verify Build Tools
    # --------------------------------------------------------
    - powershell: |

        Write-Host "======================================"
        Write-Host "Repository"
        Write-Host "======================================"

        Get-Location
        Get-ChildItem

        Write-Host ""
        Write-Host "======================================"
        Write-Host "Python Version"
        Write-Host "======================================"

        python --version

        Write-Host ""
        Write-Host "======================================"
        Write-Host "Docker Version"
        Write-Host "======================================"

        docker --version

      displayName: 'Verify Build Tools'


    # --------------------------------------------------------
    # Build Docker Image
    # --------------------------------------------------------
    - powershell: |

        Write-Host "======================================"
        Write-Host "Building Docker Image"
        Write-Host "======================================"

        docker build `
          -t "$(acrLoginServer)/$(imageName):$(Build.BuildNumber)" `
          -t "$(acrLoginServer)/$(imageName):latest" `
          .

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Docker build failed."
          exit 1
        }

        Write-Host ""
        Write-Host "Docker image created successfully."

        Write-Host ""
        Write-Host "======================================"
        Write-Host "Docker Images"
        Write-Host "======================================"

        docker images

      displayName: 'Build Docker Image'


# ============================================================
# STAGE 3 - LOGIN AND PUSH TO NEW ACR
# ============================================================
- stage: Push
  displayName: 'Push Image to New ACR'

  dependsOn: Build

  jobs:
  - job: PushImage
    displayName: 'Push Docker Image'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Login to Azure and ACR
    # --------------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Login to New Azure Container Registry'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "======================================"
          Write-Host "Current Azure Subscription"
          Write-Host "======================================"

          az account show `
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" `
            -o table

          Write-Host ""

          Write-Host "======================================"
          Write-Host "Logging into ACR"
          Write-Host "======================================"

          az acr login --name "$(acrName)"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ACR login failed."
            exit 1
          }

          Write-Host ""
          Write-Host "ACR login successful."


    # --------------------------------------------------------
    # Push Docker Images
    # --------------------------------------------------------
    - powershell: |

        Write-Host "======================================"
        Write-Host "Pushing Docker Images"
        Write-Host "======================================"

        Write-Host ""
        Write-Host "Pushing:"
        Write-Host "$(acrLoginServer)/$(imageName):$(Build.BuildNumber)"

        docker push `
          "$(acrLoginServer)/$(imageName):$(Build.BuildNumber)"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Versioned Docker image push failed."
          exit 1
        }

        Write-Host ""
        Write-Host "Pushing:"
        Write-Host "$(acrLoginServer)/$(imageName):latest"

        docker push `
          "$(acrLoginServer)/$(imageName):latest"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Latest Docker image push failed."
          exit 1
        }

        Write-Host ""
        Write-Host "======================================"
        Write-Host "Images pushed successfully"
        Write-Host "======================================"

        Write-Host "$(acrLoginServer)/$(imageName):$(Build.BuildNumber)"
        Write-Host "$(acrLoginServer)/$(imageName):latest"

      displayName: 'Push Docker Image'


# ============================================================
# STAGE 4 - VERIFY IMAGE IN NEW ACR
# ============================================================
- stage: VerifyACR
  displayName: 'Verify Image in ACR'

  dependsOn: Push

  jobs:
  - job: VerifyACRImage
    displayName: 'Verify ACR Image'

    steps:

    # --------------------------------------------------------
    # Verify ACR
    # --------------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Verify Image in New ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "======================================"
          Write-Host "Azure Subscription"
          Write-Host "======================================"

          az account show `
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" `
            -o table

          Write-Host ""

          Write-Host "======================================"
          Write-Host "ACR Repositories"
          Write-Host "======================================"

          az acr repository list `
            --name "$(acrName)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unable to list ACR repositories."
            exit 1
          }

          Write-Host ""

          Write-Host "======================================"
          Write-Host "Image Tags"
          Write-Host "======================================"

          az acr repository show-tags `
            --name "$(acrName)" `
            --repository "$(imageName)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unable to retrieve image tags."
            exit 1
          }

          Write-Host ""
          Write-Host "ACR verification completed successfully."
