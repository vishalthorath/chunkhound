trigger:
  branches:
    include:
      - main

pool:
  name: batch13-pool

variables:
  # ==============================
  # Azure
  # ==============================
  azureServiceConnection: 'batch13-connection'

  # ==============================
  # Azure Container Registry
  # ==============================
  acrName: 'vishalacr2026'
  acrLoginServer: 'vishalacr2026E.azurecr.io'

  # ==============================
  # Application
  # ==============================
  imageName: 'chunkhound'

  # ==============================
  # Version
  # Build 1 = 0.1
  # Build 2 = 0.2
  # Build 3 = 0.3
  # ==============================
  majorVersion: '0'

stages:

# ============================================================
# STAGE 1 - VERIFY AGENT AND NEW AZURE SUBSCRIPTION
# ============================================================
- stage: Verify
  displayName: 'Verify Agent and Azure Subscription'

  jobs:
  - job: VerifyEnvironment
    displayName: 'Verify Environment'

    steps:

    - checkout: self

    - script: |
        echo "======================================"
        echo "Agent Information"
        echo "======================================"
        echo "Agent Name: $(Agent.Name)"
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Version: $(Agent.Version)"
        echo ""

        echo "======================================"
        echo "Working Directory"
        echo "======================================"
        pwd
        echo ""

        echo "======================================"
        echo "Git Version"
        echo "======================================"
        git --version
      displayName: 'Verify Agent'

    # IMPORTANT:
    # This task uses the NEW Azure service connection.
    - task: AzureCLI@2
      displayName: 'Verify New Azure Subscription'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "======================================"
          echo "Azure Account"
          echo "======================================"

          az account show \
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" \
            -o table

          echo ""
          echo "======================================"
          echo "Azure CLI Version"
          echo "======================================"

          az version

          echo ""
          echo "Azure subscription verification completed."


# ============================================================
# STAGE 2 - BUILD
# ============================================================
- stage: Build
  displayName: 'Build Application'

  dependsOn: Verify

  jobs:
  - job: BuildApplication
    displayName: 'Build ChunkHound'

    steps:

    - checkout: self

    - script: |
        echo "======================================"
        echo "Repository"
        echo "======================================"
        pwd
        ls -la

        echo ""
        echo "======================================"
        echo "Python Version"
        echo "======================================"

        python3 --version || true

        echo ""
        echo "======================================"
        echo "Docker Version"
        echo "======================================"

        docker --version || true
      displayName: 'Verify Build Tools'

    - script: |
        echo "======================================"
        echo "Building Docker Image"
        echo "======================================"

        docker build \
          -t $(acrLoginServer)/$(imageName):$(Build.BuildNumber) \
          -t $(acrLoginServer)/$(imageName):latest \
          .

        echo ""
        echo "Docker image created successfully."

        docker images
      displayName: 'Build Docker Image'


# ============================================================
# STAGE 3 - LOGIN TO NEW ACR
# ============================================================
- stage: Push
  displayName: 'Push Image to New ACR'

  dependsOn: Build

  jobs:
  - job: PushImage
    displayName: 'Push Docker Image'

    steps:

    - checkout: self

    # AzureCLI automatically authenticates using
    # the NEW service connection.
    - task: AzureCLI@2
      displayName: 'Login to New Azure Container Registry'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          echo "======================================"
          echo "Current Azure Subscription"
          echo "======================================"

          az account show \
            --query "{Name:name, SubscriptionId:id}" \
            -o table

          echo ""
          echo "======================================"
          echo "Logging into ACR"
          echo "======================================"

          az acr login --name "$(acrName)"

          echo ""
          echo "ACR login successful."


    - script: |

        echo "======================================"
        echo "Pushing Docker Images"
        echo "======================================"

        docker push \
          $(acrLoginServer)/$(imageName):$(Build.BuildNumber)

        docker push \
          $(acrLoginServer)/$(imageName):latest

        echo ""
        echo "======================================"
        echo "Images pushed successfully"
        echo "======================================"

        echo "$(acrLoginServer)/$(imageName):$(Build.BuildNumber)"
        echo "$(acrLoginServer)/$(imageName):latest"

      displayName: 'Push Docker Image'


# ============================================================
# STAGE 4 - VERIFY IMAGE IN NEW ACR
# ============================================================
- stage: VerifyACR
  displayName: 'Verify Image in ACR'

  dependsOn: Push

  jobs:
  - job: VerifyACRImage
    displayName: 'Verify ACR Image'

    steps:

    - task: AzureCLI@2
      displayName: 'Verify Image in New ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          echo "======================================"
          echo "Azure Subscription"
          echo "======================================"

          az account show \
            --query "{Name:name, SubscriptionId:id}" \
            -o table

          echo ""
          echo "======================================"
          echo "ACR Repositories"
          echo "======================================"

          az acr repository list \
            --name "$(acrName)" \
            --output table

          echo ""
          echo "======================================"
          echo "Image Tags"
          echo "======================================"

          az acr repository show-tags \
            --name "$(acrName)" \
            --repository "$(imageName)" \
            --output table

          echo ""
          echo "ACR verification completed successfully."
