trigger:
  branches:
    include:
      - main

pr: none


# =========================================================
# SELF-HOSTED WINDOWS AGENT
# =========================================================

pool:
  name: 'batch13-pool'


# =========================================================
# VARIABLES
# =========================================================

variables:

  # =======================================================
  # AZURE
  # =======================================================

  RESOURCE_GROUP: 'VT-RG'
  STORAGE_ACCOUNT: 'vishalsa007'
  STORAGE_CONTAINER: 'chunkhound-artifacts'

  # =======================================================
  # AZURE CONTAINER REGISTRY
  # =======================================================

  ACR_NAME: 'vishalacr2026'
  ACR_LOGIN_SERVER: 'vishalacr2026.azurecr.io'
  ACR_REPOSITORY: 'chunkhound-artifact'

  # =======================================================
  # ARTIFACT
  # =======================================================

  ARTIFACT_DIR: 'artifacts'

  APP_VERSION: '0.$(Build.BuildId)'
  ARTIFACT_FILE: 'chunkhound-$(Build.BuildId).tar.gz'


# =========================================================
# STAGES
# =========================================================

stages:


# ################################################################
# STAGE 1
# VERIFY WINDOWS SELF-HOSTED AGENT
# ################################################################

- stage: VerifyAgent

  displayName: 'Stage 1 - Verify Windows Agent'

  jobs:

  - job: VerifyWindowsAgent

    displayName: 'Verify Self-Hosted Windows Agent'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: self

      displayName: 'Checkout Repository'


    # =========================================================
    # VERIFY WINDOWS AGENT
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "WINDOWS SELF-HOSTED AGENT"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Agent Name:"
        Write-Host "$(Agent.Name)"

        Write-Host ""
        Write-Host "Machine Name:"
        Write-Host "$(Agent.MachineName)"

        Write-Host ""
        Write-Host "Agent OS:"
        Write-Host "$(Agent.OS)"

        Write-Host ""
        Write-Host "Agent Version:"
        Write-Host "$(Agent.Version)"

        Write-Host ""
        Write-Host "PowerShell Version:"
        $PSVersionTable.PSVersion

        Write-Host ""
        Write-Host "Operating System:"

        Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-Table -AutoSize

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "AGENT VERIFICATION SUCCESS"
        Write-Host "=========================================="

      displayName: 'Verify Self-Hosted Windows Agent'


    # =========================================================
    # VERIFY GIT
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "GIT VERIFICATION"
        Write-Host "=========================================="

        git --version

        if ($LASTEXITCODE -ne 0) {
            throw "Git verification failed."
        }

        Write-Host ""
        Write-Host "Current Commit:"
        git rev-parse HEAD

        Write-Host ""
        Write-Host "Repository:"
        git remote -v

        Write-Host ""
        Write-Host "Repository contents:"
        Get-ChildItem -Force

        Write-Host ""
        Write-Host "Git verification completed."

      displayName: 'Verify Git and Checkout'


# ################################################################
# STAGE 2
# BUILD CHUNKHOUND
# ################################################################

- stage: BuildChunkHound

  displayName: 'Stage 2 - Build ChunkHound'

  dependsOn: VerifyAgent

  condition: succeeded()

  jobs:

  - job: BuildChunkHound

    displayName: 'Build ChunkHound'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: self

      displayName: 'Checkout Repository'


    # =========================================================
    # VERIFY PYTHON
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "PYTHON VERIFICATION"
        Write-Host "=========================================="

        $python = Get-Command python -ErrorAction SilentlyContinue

        if (-not $python) {
            $python = Get-Command python3 -ErrorAction SilentlyContinue
        }

        if (-not $python) {
            throw "Python was not found on the Windows agent."
        }

        Write-Host ""
        Write-Host "Python executable:"
        Write-Host $python.Source

        Write-Host ""
        Write-Host "Python version:"

        & $python.Source --version

        if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
        }

        Write-Host ""
        Write-Host "Pip version:"

        & $python.Source -m pip --version

        if ($LASTEXITCODE -ne 0) {
            throw "Pip verification failed."
        }

        Write-Host ""
        Write-Host "Python verification successful."

      displayName: 'Verify Python'


    # =========================================================
    # CREATE VIRTUAL ENVIRONMENT
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "CREATING PYTHON VIRTUAL ENVIRONMENT"
        Write-Host "=========================================="

        if (Test-Path "venv") {

            Write-Host "Removing existing venv..."

            Remove-Item `
              -Recurse `
              -Force `
              "venv"
        }

        $python = Get-Command python -ErrorAction SilentlyContinue

        if (-not $python) {
            $python = Get-Command python3 -ErrorAction SilentlyContinue
        }

        if (-not $python) {
            throw "Python was not found."
        }

        & $python.Source -m venv venv

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to create virtual environment."
        }

        Write-Host ""
        Write-Host "Python:"
        & ".\venv\Scripts\python.exe" --version

        Write-Host ""
        Write-Host "Pip:"
        & ".\venv\Scripts\python.exe" -m pip --version

        Write-Host ""
        Write-Host "Upgrading pip..."

        & ".\venv\Scripts\python.exe" `
          -m pip install `
          --upgrade pip

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
        }

        Write-Host ""
        Write-Host "Virtual environment created successfully."

      displayName: 'Create Python Virtual Environment'


    # =========================================================
    # INSTALL DEPENDENCIES
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "INSTALLING PYTHON DEPENDENCIES"
        Write-Host "=========================================="

        $pythonPath = ".\venv\Scripts\python.exe"

        if (-not (Test-Path $pythonPath)) {
            throw "Virtual environment Python was not found."
        }

        if (Test-Path "requirements.txt") {

            Write-Host ""
            Write-Host "requirements.txt found."

            & $pythonPath `
              -m pip install `
              -r requirements.txt

            if ($LASTEXITCODE -ne 0) {
                throw "Dependency installation failed."
            }

        }
        elseif (Test-Path "pyproject.toml") {

            Write-Host ""
            Write-Host "pyproject.toml found."

            & $pythonPath `
              -m pip install .

            if ($LASTEXITCODE -ne 0) {
                throw "Python package installation failed."
            }

        }
        else {

            Write-Host ""
            Write-Host "No requirements.txt or pyproject.toml found."

            Write-Host ""
            Write-Host "Repository files:"

            Get-ChildItem -Recurse -File |
                Select-Object -First 100 FullName

            throw "Python dependency definition was not found."

        }

        Write-Host ""
        Write-Host "Dependencies installed successfully."

      displayName: 'Install Python Dependencies'


    # =========================================================
    # VERIFY CHUNKHOUND SOURCE
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "VERIFYING CHUNKHOUND SOURCE"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Repository root:"
        Get-Location

        Write-Host ""
        Write-Host "Top-level directories:"

        Get-ChildItem -Directory |
            Select-Object Name

        Write-Host ""
        Write-Host "Top-level files:"

        Get-ChildItem -File |
            Select-Object Name

        Write-Host ""
        Write-Host "Checking ChunkHound source structure..."

        if (
            (Test-Path "src" -PathType Container) -or
            (Test-Path "site" -PathType Container) -or
            (Test-Path "chunkhound" -PathType Container)
        ) {

            Write-Host ""
            Write-Host "ChunkHound source structure detected."

        }
        else {

            Write-Host ""
            Write-Host "WARNING: Expected source directories were not detected."

            Write-Host ""
            Write-Host "Repository structure:"

            Get-ChildItem -Recurse -Directory |
                Select-Object -First 100 FullName
        }

        Write-Host ""
        Write-Host "Source verification completed."

      displayName: 'Verify ChunkHound Source'


# ################################################################
# STAGE 3
# CREATE AND PUBLISH ARTIFACT
# ################################################################

- stage: CreateArtifact

  displayName: 'Stage 3 - Create and Publish Artifact'

  dependsOn: BuildChunkHound

  condition: succeeded()

  jobs:

  - job: CreateAndPublishArtifact

    displayName: 'Create ChunkHound Artifact'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: self

      displayName: 'Checkout Repository'


    # =========================================================
    # CREATE ARTIFACT
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "CREATING CHUNKHOUND ARTIFACT"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Build ID:"
        Write-Host "$(Build.BuildId)"

        Write-Host ""
        Write-Host "Application Version:"
        Write-Host "$(APP_VERSION)"

        Write-Host ""
        Write-Host "Artifact:"
        Write-Host "$(ARTIFACT_FILE)"


        # -----------------------------------------------------
        # CLEAN ARTIFACT DIRECTORY
        # -----------------------------------------------------

        if (Test-Path "$(ARTIFACT_DIR)") {

            Remove-Item `
              -Recurse `
              -Force `
              "$(ARTIFACT_DIR)"
        }

        New-Item `
          -ItemType Directory `
          -Path "$(ARTIFACT_DIR)" `
          -Force | Out-Null


        # -----------------------------------------------------
        # CHECK TAR
        # -----------------------------------------------------

        $tar = Get-Command tar -ErrorAction SilentlyContinue

        if (-not $tar) {
            throw "tar command was not found on Windows agent."
        }

        Write-Host ""
        Write-Host "tar location:"
        Write-Host $tar.Source


        # -----------------------------------------------------
        # ARTIFACT PATH
        # -----------------------------------------------------

        $artifactPath = Join-Path `
          "$(ARTIFACT_DIR)" `
          "$(ARTIFACT_FILE)"


        # -----------------------------------------------------
        # CREATE TAR.GZ
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Creating tar.gz artifact..."

        & tar `
          --exclude=".git" `
          --exclude="venv" `
          --exclude="artifacts" `
          --exclude="__pycache__" `
          --exclude="*.pyc" `
          -czf `
          $artifactPath `
          .

        if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tar.gz artifact."
        }


        # -----------------------------------------------------
        # VERIFY ARTIFACT
        # -----------------------------------------------------

        if (-not (Test-Path $artifactPath -PathType Leaf)) {
            throw "Artifact was not created."
        }

        $artifact = Get-Item $artifactPath

        if ($artifact.Length -le 0) {
            throw "Artifact has zero bytes."
        }

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "ARTIFACT CREATED"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Artifact:"
        Write-Host $artifact.FullName

        Write-Host ""
        Write-Host "Size:"
        Write-Host "$([math]::Round($artifact.Length / 1MB, 2)) MB"


        # -----------------------------------------------------
        # INSPECTION
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Inspecting artifact..."

        $contents = & tar -tzf $artifactPath 2>&1

        if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host "First 50 entries:"

            $contents |
                Select-Object -First 50

            Write-Host ""
            Write-Host "Artifact inspection successful."

        }
        else {

            Write-Host ""
            Write-Host "WARNING: Artifact inspection failed."

            Write-Host ""
            Write-Host "The artifact exists and has a non-zero size."

            Write-Host ""
            Write-Host "Pipeline will continue."
        }


        # -----------------------------------------------------
        # FINAL CHECK
        # -----------------------------------------------------

        if (
            (Test-Path $artifactPath -PathType Leaf) -and
            ((Get-Item $artifactPath).Length -gt 0)
        ) {

            Write-Host ""
            Write-Host "Artifact is ready for publishing."

        }
        else {

            throw "Final artifact validation failed."
        }

      displayName: 'Create ChunkHound Artifact'


    # =========================================================
    # PUBLISH PIPELINE ARTIFACT
    # =========================================================

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Artifact to Azure DevOps'

      inputs:

        targetPath: '$(Build.SourcesDirectory)\$(ARTIFACT_DIR)'

        artifact: 'chunkhound-artifact'

        publishLocation: 'pipeline'


# ################################################################
# STAGE 4
# UPLOAD TO AZURE BLOB
# ################################################################

- stage: UploadBlob

  displayName: 'Stage 4 - Upload Artifact to Azure Blob'

  dependsOn: CreateArtifact

  condition: succeeded()

  jobs:

  - job: UploadBlobStorage

    displayName: 'Upload Artifact to Azure Blob Storage'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: self

      displayName: 'Checkout Repository'


    # =========================================================
    # DOWNLOAD PIPELINE ARTIFACT
    # =========================================================

    - task: DownloadPipelineArtifact@2

      displayName: 'Download ChunkHound Artifact'

      inputs:

        artifact: 'chunkhound-artifact'

        path: '$(Pipeline.Workspace)\chunkhound-artifact'


    # =========================================================
    # UPLOAD TO BLOB
    # =========================================================

    - task: AzureCLI@2

      displayName: 'Upload Artifact to Azure Blob Storage'

      inputs:

        azureSubscription: 'batch13-connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        powerShellErrorActionPreference: 'stop'

        addSpnToEnvironment: false

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "AZURE BLOB STORAGE"
          Write-Host "=========================================="


          # -----------------------------------------------------
          # ARTIFACT
          # -----------------------------------------------------

          $artifactPath = Join-Path `
            "$(Pipeline.Workspace)\chunkhound-artifact" `
            "$(ARTIFACT_FILE)"

          if (-not (Test-Path $artifactPath -PathType Leaf)) {

              Write-Host ""
              Write-Host "Artifact not found."

              Write-Host ""
              Write-Host "Available files:"

              Get-ChildItem `
                "$(Pipeline.Workspace)\chunkhound-artifact" `
                -Recurse

              throw "Artifact file was not found."
          }


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifactPath


          # -----------------------------------------------------
          # AZURE ACCOUNT
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Azure account:"

          az account show `
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Azure account verification failed."
          }


          # -----------------------------------------------------
          # RESOURCE GROUP
          # -----------------------------------------------------

          az group show `
            --name "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Resource group verification failed."
          }


          # -----------------------------------------------------
          # STORAGE ACCOUNT
          # -----------------------------------------------------

          az storage account show `
            --name "$(STORAGE_ACCOUNT)" `
            --resource-group "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Storage account verification failed."
          }


          # -----------------------------------------------------
          # STORAGE CONTAINER
          # -----------------------------------------------------

          az storage container show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --name "$(STORAGE_CONTAINER)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Storage container verification failed."
          }


          # -----------------------------------------------------
          # BLOB PATHS
          # -----------------------------------------------------

          $versionedBlob = "chunkhound/$(APP_VERSION)/$(ARTIFACT_FILE)"

          $latestBlob = "chunkhound/latest/$(ARTIFACT_FILE)"


          # -----------------------------------------------------
          # VERSIONED BLOB
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Uploading versioned Blob..."

          az storage blob upload `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $versionedBlob `
            --file $artifactPath `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              throw "Versioned Blob upload failed."
          }


          # -----------------------------------------------------
          # LATEST BLOB
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Uploading latest Blob..."

          az storage blob upload `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $latestBlob `
            --file $artifactPath `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              throw "Latest Blob upload failed."
          }


          # -----------------------------------------------------
          # VERIFY
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Verifying versioned Blob..."

          az storage blob show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $versionedBlob `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Versioned Blob verification failed."
          }


          Write-Host ""
          Write-Host "Verifying latest Blob..."

          az storage blob show `
            --auth-mode login `
            --account-name "$(STORAGE_ACCOUNT)" `
            --container-name "$(STORAGE_CONTAINER)" `
            --name $latestBlob `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Latest Blob verification failed."
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BLOB UPLOAD SUCCESS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Versioned Blob:"
          Write-Host $versionedBlob

          Write-Host ""
          Write-Host "Latest Blob:"
          Write-Host $latestBlob


# ################################################################
# STAGE 5
# PUBLISH TO ACR
# ################################################################

- stage: PublishACR

  displayName: 'Stage 5 - Publish Artifact to ACR'

  dependsOn: UploadBlob

  condition: succeeded()

  jobs:

  - job: PublishToACR

    displayName: 'Publish ChunkHound Artifact to ACR'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: self

      displayName: 'Checkout Repository'


    # =========================================================
    # DOWNLOAD ARTIFACT
    # =========================================================

    - task: DownloadPipelineArtifact@2

      displayName: 'Download ChunkHound Artifact'

      inputs:

        artifact: 'chunkhound-artifact'

        path: '$(Pipeline.Workspace)\chunkhound-artifact'


    # =========================================================
    # INSTALL / VERIFY ORAS
    # =========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "ORAS INSTALLATION"
        Write-Host "=========================================="

        $orasVersion = "1.2.0"

        $orasDirectory = Join-Path `
          $env:USERPROFILE `
          "oras"

        $orasExe = Join-Path `
          $orasDirectory `
          "oras.exe"


        # -----------------------------------------------------
        # CREATE ORAS DIRECTORY
        # -----------------------------------------------------

        if (-not (Test-Path $orasDirectory)) {

            New-Item `
              -ItemType Directory `
              -Path $orasDirectory `
              -Force | Out-Null
        }


        # -----------------------------------------------------
        # CHECK EXISTING ORAS
        # -----------------------------------------------------

        if (Test-Path $orasExe) {

            Write-Host ""
            Write-Host "ORAS already exists."

        }
        else {

            Write-Host ""
            Write-Host "Downloading ORAS $orasVersion..."

            $zipPath = Join-Path `
              $env:TEMP `
              "oras-$orasVersion.zip"

            $extractPath = Join-Path `
              $env:TEMP `
              "oras-extract-$orasVersion"

            $downloadUrl = `
              "https://github.com/oras-project/oras/releases/download/v$orasVersion/oras_${orasVersion}_windows_amd64.zip"


            Invoke-WebRequest `
              -Uri $downloadUrl `
              -OutFile $zipPath


            if (-not (Test-Path $zipPath)) {
                throw "ORAS download failed."
            }


            if (Test-Path $extractPath) {

                Remove-Item `
                  -Recurse `
                  -Force `
                  $extractPath
            }


            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $extractPath `
              -Force


            $downloadedOras = Join-Path `
              $extractPath `
              "oras.exe"


            if (-not (Test-Path $downloadedOras)) {
                throw "oras.exe was not found."
            }


            Copy-Item `
              $downloadedOras `
              $orasExe `
              -Force


            Write-Host ""
            Write-Host "ORAS installed successfully."
        }


        # -----------------------------------------------------
        # VERIFY
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "ORAS executable:"
        Write-Host $orasExe

        & $orasExe version

        if ($LASTEXITCODE -ne 0) {
            throw "ORAS verification failed."
        }

        Write-Host ""
        Write-Host "ORAS verification successful."

      displayName: 'Install and Verify ORAS'


    # =========================================================
    # PUSH TO ACR
    # =========================================================

    - task: AzureCLI@2

      displayName: 'Push Artifact to Azure Container Registry'

      inputs:

        azureSubscription: 'batch13-connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        powerShellErrorActionPreference: 'stop'

        addSpnToEnvironment: false

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "AZURE CONTAINER REGISTRY"
          Write-Host "=========================================="


          # -----------------------------------------------------
          # ARTIFACT
          # -----------------------------------------------------

          $artifactPath = Join-Path `
            "$(Pipeline.Workspace)\chunkhound-artifact" `
            "$(ARTIFACT_FILE)"


          if (-not (Test-Path $artifactPath -PathType Leaf)) {
              throw "Artifact was not found: $artifactPath"
          }


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifactPath


          # -----------------------------------------------------
          # ACR
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Verifying ACR..."

          az acr show `
            --name "$(ACR_NAME)" `
            --resource-group "$(RESOURCE_GROUP)" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "ACR verification failed."
          }


          # -----------------------------------------------------
          # GET ACR TOKEN
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Getting ACR access token..."

          $acrToken = az acr login `
            --name "$(ACR_NAME)" `
            --expose-token `
            --query accessToken `
            --output tsv


          if ($LASTEXITCODE -ne 0) {
              throw "Unable to obtain ACR access token."
          }


          if ([string]::IsNullOrWhiteSpace($acrToken)) {
              throw "ACR access token is empty."
          }


          # -----------------------------------------------------
          # ORAS PATH
          # -----------------------------------------------------

          $orasPath = Join-Path `
            $env:USERPROFILE `
            "oras\oras.exe"


          if (-not (Test-Path $orasPath)) {

              $orasCommand = Get-Command oras `
                -ErrorAction SilentlyContinue

              if ($orasCommand) {
                  $orasPath = $orasCommand.Source
              }
          }


          if (-not (Test-Path $orasPath)) {
              throw "ORAS executable was not found."
          }


          Write-Host ""
          Write-Host "ORAS:"
          Write-Host $orasPath


          & $orasPath version

          if ($LASTEXITCODE -ne 0) {
              throw "ORAS verification failed."
          }


          # -----------------------------------------------------
          # ORAS LOGIN
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Logging into ACR using ORAS..."


          $acrToken |
            & $orasPath login `
              "$(ACR_LOGIN_SERVER)" `
              --username "00000000-0000-0000-0000-000000000000" `
              --password-stdin


          if ($LASTEXITCODE -ne 0) {
              throw "ORAS ACR login failed."
          }


          Write-Host ""
          Write-Host "ORAS ACR login successful."


          # -----------------------------------------------------
          # VERSION TAG
          # -----------------------------------------------------

          $versionTag = `
            "$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):$(APP_VERSION)"


          Write-Host ""
          Write-Host "Pushing versioned artifact..."

          Write-Host ""
          Write-Host "Target:"
          Write-Host $versionTag


          & $orasPath push `
            $versionTag `
            "${artifactPath}:application/gzip"


          if ($LASTEXITCODE -ne 0) {
              throw "Versioned ORAS push failed."
          }


          Write-Host ""
          Write-Host "Versioned artifact pushed successfully."


          # -----------------------------------------------------
          # LATEST TAG
          # -----------------------------------------------------

          $latestTag = `
            "$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):latest"


          Write-Host ""
          Write-Host "Pushing latest artifact..."

          Write-Host ""
          Write-Host "Target:"
          Write-Host $latestTag


          & $orasPath push `
            $latestTag `
            "${artifactPath}:application/gzip"


          if ($LASTEXITCODE -ne 0) {
              throw "Latest ORAS push failed."
          }


          Write-Host ""
          Write-Host "Latest artifact pushed successfully."


          # -----------------------------------------------------
          # VERIFY REPOSITORY
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Verifying ACR repository..."


          az acr repository show `
            --name "$(ACR_NAME)" `
            --repository "$(ACR_REPOSITORY)" `
            --output table


          if ($LASTEXITCODE -ne 0) {
              throw "ACR repository verification failed."
          }


          # -----------------------------------------------------
          # VERIFY TAGS
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "Verifying ACR tags..."


          az acr repository show-tags `
            --name "$(ACR_NAME)" `
            --repository "$(ACR_REPOSITORY)" `
            --output table


          if ($LASTEXITCODE -ne 0) {
              throw "ACR tag verification failed."
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ACR PUBLISH SUCCESS"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "ACR:"
          Write-Host "$(ACR_LOGIN_SERVER)"


          Write-Host ""
          Write-Host "Repository:"
          Write-Host "$(ACR_REPOSITORY)"


          Write-Host ""
          Write-Host "Version:"
          Write-Host "$(APP_VERSION)"


          Write-Host ""
          Write-Host "Latest:"
          Write-Host "latest"


# ################################################################
# STAGE 6
# FINAL VERIFICATION
# ################################################################

- stage: FinalVerification

  displayName: 'Stage 6 - Final Verification'

  dependsOn:
    - UploadBlob
    - PublishACR

  condition: succeeded()

  jobs:

  - job: FinalVerificationJob

    displayName: 'Verify Final Deployment Artifacts'

    pool:
      name: 'batch13-pool'

    steps:

    - checkout: none


    - task: AzureCLI@2

      displayName: 'Final Azure Verification'

      inputs:

        azureSubscription: 'batch13-connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        powerShellErrorActionPreference: 'stop'

        addSpnToEnvironment: false

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "       CHUNKHOUND PIPELINE SUCCESS"
          Write-Host "================================================"


          Write-Host ""
          Write-Host "Build ID:"
          Write-Host "$(Build.BuildId)"


          Write-Host ""
