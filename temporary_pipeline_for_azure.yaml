trigger: none

pool:
  name: 'batch13-pool'

stages:

- stage: Test
  displayName: 'Test Job'

  jobs:

  - job: TestAgent
    displayName: 'Test Agent'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - powershell: |

        Write-Host "=========================================="
        Write-Host "AGENT TEST SUCCESSFUL"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Computer:"
        hostname

        Write-Host ""
        Write-Host "User:"
        whoami

        Write-Host ""
        Write-Host "PowerShell:"
        `$PSVersionTable.PSVersion

        Write-Host ""
        Write-Host "Azure CLI:"
        az version

      displayName: 'Test Windows Agent'
